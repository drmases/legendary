name: Deploy to globbin.se/legendary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dist (with config.php from secrets)
        # Host, database and user are not secret; the passwords are.
        env:
          DB_HOST: globbin.se.mysql
          DB_NAME: globbin_se
          DB_USER: globbin_se
          DB_PASS: ${{ secrets.DB_PASS }}
          EDIT_PASSWORD: ${{ secrets.EDIT_PASSWORD }}
        run: |
          for v in DB_PASS EDIT_PASSWORD; do
            [ -n "${!v}" ] || { echo "Secret $v is missing"; exit 1; }
          done
          mkdir dist
          cp index.html api.php dist/
          php -r 'echo "<?php\nreturn " . var_export([
            "db_host" => getenv("DB_HOST"),
            "db_name" => getenv("DB_NAME"),
            "db_user" => getenv("DB_USER"),
            "db_pass" => getenv("DB_PASS"),
            "edit_password" => getenv("EDIT_PASSWORD"),
          ], true) . ";\n";' > dist/config.php
          php -l dist/config.php
          php -l dist/api.php

      - name: Deploy app
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./dist/*
          remote_path: ${{ secrets.FTP_FRONTEND_DIR }}

      - name: Redirect old address (marvel-legendary -> legendary/#marvel)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./redirect/marvel-legendary/*
          remote_path: webroots/www/marvel-legendary/

      # sftp's glob skips dotfiles, so .htaccess needs its own upload.
      - name: Redirect old address (.htaccess)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./redirect/marvel-legendary/.htaccess
          remote_path: webroots/www/marvel-legendary/
