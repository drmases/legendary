<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legendary Score Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #101118;
    --panel: #181a24;
    --panel-2: #1f2230;
    --line: #2c3042;
    --text: #e9eaf0;
    --muted: #8d91a6;
    --win: #3ccf7a;
    --loss: #ff5d5d;
    --accent: #e62429;
    --display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    --body: 'Barlow', 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }

/* ---------- Header + game shelf ---------- */
header.top {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 22px 0 14px;
}
.wordmark {
    font-family: var(--display); font-weight: 800; font-size: 2.4rem;
    letter-spacing: .02em; line-height: 1; text-transform: uppercase;
    background: none; border: 0; cursor: pointer; color: var(--text);
}
.wordmark small { color: var(--accent); transition: color .2s; }
header.top p { color: var(--muted); }

.shelf {
    display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 6px;
    border-bottom: 1px solid var(--line); margin-bottom: 22px;
}
.spine {
    --c: #888;
    position: relative; cursor: pointer; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
    border-top: 4px solid var(--c);
    padding: 10px 12px 12px; border-radius: 4px 4px 0 0;
    transform: translateY(6px); transition: transform .15s, background .15s;
}
.spine:hover { transform: translateY(2px); }
.spine[aria-current="true"] { transform: translateY(0); background: var(--panel-2); }
.spine .name {
    display: block; font-family: var(--display); font-weight: 800;
    font-size: 1.35rem; line-height: 1.05; text-transform: uppercase; color: var(--c);
}
.spine .meta { display: block; font-size: .8rem; color: var(--muted); margin-top: 4px; }

/* ---------- Overview ---------- */
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.ov-card {
    --c: #888;
    background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c);
    border-radius: 6px; padding: 18px 20px; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-start;
}
.ov-card:hover { background: var(--panel-2); }
.ov-card h2 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; color: var(--c); line-height: 1; }
.ov-card .full { color: var(--muted); font-size: .9rem; margin: 4px 0 14px; }
.ov-nums { display: flex; gap: 22px; }
.ov-nums b { display: block; font-family: var(--display); font-size: 1.8rem; line-height: 1; }
.ov-nums span { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.ov-empty { color: var(--muted); font-size: .9rem; }
.ov-recent { margin-top: 14px; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.ov-recent strong { color: var(--text); font-weight: 500; }

/* ---------- Franchise view ---------- */
.dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.stat span { font-size: .8rem; color: var(--muted); }
.stat b { display: block; font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.1; }
.stat.win b { color: var(--win); }
.stat.loss b { color: var(--loss); }
.stat.hi b { color: var(--accent); }

.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 160px; }
input, select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; width: 100%;
}
input:focus, select:focus { border-color: var(--accent); outline: none; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab {
    background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px;
    padding: 10px 16px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.panel[hidden] { display: none; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: .8rem; white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--text); }
th.sorted::after { content: ' ▲'; color: var(--accent); }
th.sorted.desc::after { content: ' ▼'; }
tbody tr:hover { background: rgba(255,255,255,.03); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pen { color: var(--loss); font-size: .85em; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: .8rem; font-weight: 600; color: #fff; white-space: nowrap; text-shadow: 0 1px 1px rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.type { color: var(--muted); font-size: .85rem; }
.rating { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 6px; height: 12px; background: var(--line); border-radius: 1px; }
.pips i.on { background: var(--accent); }
.rating b { font-family: var(--display); font-size: 1.1rem; }
.res-win { color: var(--win); font-weight: 600; }
.res-loss { color: var(--loss); font-weight: 600; }
.res-draw { color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); font-weight: 400; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; }
.row-actions { display: flex; gap: 4px; }
.icon-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; width: 30px; height: 30px; cursor: pointer; }
.icon-btn:hover { border-color: var(--accent); }

.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.chart h3 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin-bottom: 12px; }
.bar { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; margin-bottom: 7px; font-size: .88rem; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; background: var(--panel-2); border-radius: 2px; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 2px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; }

.form-box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 16px; }
.form-box.editing { border-color: var(--accent); }
.form-box h3 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.grid label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
.grid .wide { grid-column: 1 / -1; }
.score-preview { font-size: .9rem; color: var(--muted); margin-top: 10px; }
.score-preview b { color: var(--text); font-family: var(--display); font-size: 1.3rem; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
.btn:hover { filter: brightness(1.1); }

.toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120px);
    background: var(--panel-2); border: 1px solid var(--accent); padding: 10px 18px; border-radius: 6px;
    transition: transform .25s; z-index: 10;
}
.toast.show { transform: translateX(-50%) translateY(0); }
footer { color: var(--muted); font-size: .8rem; margin-top: 36px; }

@media (max-width: 900px) {
    .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 0; }
    .spine { transform: none; border-bottom: 1px solid var(--line); border-radius: 4px; }
    .spine:hover { transform: none; }
}
@media (max-width: 500px) {
    .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bar { grid-template-columns: 100px 1fr 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
    <header class="top">
        <button class="wordmark" id="homeBtn" title="All games">Legendary <small id="wordmarkSub">Score Board</small></button>
        <p id="tagline">Every game, every expansion, every result.</p>
    </header>

    <nav class="shelf" id="shelf" aria-label="Choose game"></nav>

    <!-- Overview: all games -->
    <section id="overviewView">
        <div class="overview" id="overviewGrid"></div>
    </section>

    <!-- One game -->
    <section id="franchiseView" hidden>
        <div class="dash" id="dash"></div>

        <div class="filters">
            <label>Expansion<select id="fExpansion"></select></label>
            <label>Card type<select id="fType"></select></label>
            <label>Search<input type="search" id="fSearch" placeholder="Name, comment, expansion"></label>
            <label>Min rating<select id="fRating">
                <option value="">Any</option><option value="9">9+</option><option value="8">8+</option>
                <option value="7">7+</option><option value="6">6+</option><option value="5">5+</option>
            </select></label>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="games" aria-selected="true">Game results</button>
            <button class="tab" role="tab" data-tab="cards" aria-selected="false">Cards</button>
            <button class="tab" role="tab" data-tab="stats" aria-selected="false">Statistics</button>
            <button class="tab" role="tab" data-tab="add" aria-selected="false">+ Add</button>
        </div>

        <div class="panel" id="panel-games">
            <div class="table-wrap"><table>
                <thead id="gamesHead"></thead>
                <tbody id="gamesBody"></tbody>
            </table></div>
        </div>

        <div class="panel" id="panel-cards" hidden>
            <div class="table-wrap"><table>
                <thead><tr>
                    <th class="sortable" data-sort="expansion">Expansion</th>
                    <th class="sortable" data-sort="type">Type</th>
                    <th class="sortable" data-sort="name">Name</th>
                    <th>Comment</th>
                    <th class="sortable" data-sort="ranking">Rating</th>
                    <th></th>
                </tr></thead>
                <tbody id="cardsBody"></tbody>
            </table></div>
        </div>

        <div class="panel" id="panel-stats" hidden>
            <div class="charts" id="charts"></div>
        </div>

        <div class="panel" id="panel-add" hidden>
            <form class="form-box" id="gameForm">
                <h3 id="gameFormTitle">Add game result</h3>
                <div class="grid">
                    <label>Expansion<input id="gExpansion" list="expansionList" required></label>
                    <label><span id="gNameLabel">Scheme</span><input id="gName" required></label>
                    <label>Played<input id="gPlayed" type="date"></label>
                    <label>Rating (1–10)<input id="gRating" type="number" min="1" max="10"></label>
                    <label>Outcome<select id="gOutcome">
                        <option value="">–</option><option value="win">Win</option><option value="loss">Loss</option><option value="draw">Draw</option>
                    </select></label>
                    <label class="wide">Result note<input id="gResultNote" placeholder="e.g. Won with two cards left in the villain deck"></label>
                </div>
                <div class="grid" id="detailedScore" style="margin-top:12px"></div>
                <div class="grid" id="simpleScore" style="margin-top:12px">
                    <label><span id="gScoreLabel">Score</span><input id="gScore" type="number"></label>
                </div>
                <p class="score-preview" id="scorePreview"></p>
                <div class="grid" style="margin-top:12px">
                    <label class="wide"><span id="gHeroesLabel">Heroes & mastermind used</span><input id="gHeroes"></label>
                    <label class="wide">Comment<input id="gComment" placeholder="How did it go?"></label>
                </div>
                <div class="actions">
                    <button class="btn primary" type="submit" id="gameSubmit">Add result</button>
                    <button class="btn" type="button" id="gameCancel" hidden>Cancel</button>
                </div>
            </form>

            <form class="form-box" id="cardForm">
                <h3 id="cardFormTitle">Add card</h3>
                <div class="grid">
                    <label>Expansion<input id="cExpansion" list="expansionList" required></label>
                    <label>Type<select id="cType"></select></label>
                    <label>Name<input id="cName" required></label>
                    <label>Rating (1–10)<input id="cRating" type="number" min="1" max="10"></label>
                    <label class="wide">Comment<input id="cComment"></label>
                </div>
                <div class="actions">
                    <button class="btn primary" type="submit" id="cardSubmit">Add card</button>
                    <button class="btn" type="button" id="cardCancel" hidden>Cancel</button>
                </div>
            </form>

            <div class="form-box">
                <h3>Data</h3>
                <p class="muted" id="dataCount"></p>
                <div class="actions">
                    <button class="btn" type="button" id="exportBtn">Export this game (JSON)</button>
                    <button class="btn" type="button" id="exportAllBtn">Export everything (JSON)</button>
                    <button class="btn" type="button" id="logoutBtn">Forget edit password</button>
                </div>
            </div>
            <datalist id="expansionList"></datalist>
        </div>
    </section>

    <footer>Legendary score board · globbin.se</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   Game configuration. Change labels, card types or scoring here.
   scoring: 'detailed' = victory pile minus penalties (each penalty: count × per)
            'simple'   = one optional score number (scoreLabel explains the scale)
            'none'     = the game has no score, only an outcome
   The first three card types get "Top rated" charts; the first two get a dashboard tile.
   ============================================================ */
const P = {   // penalty fields; key/pen match the game properties (bystanders/bystanderPenalty, …)
    bystanders: { key: 'bystanders', pen: 'bystanderPenalty' },
    twists:     { key: 'twists',     pen: 'twistPenalty',  label: 'Scheme twists',    short: 'Twists',  per: -3 },
    escaped:    { key: 'escaped',    pen: 'escapePenalty', label: 'Villains escaped', short: 'Escaped', per: -1 },
    danger:     { key: 'danger',     pen: 'dangerPenalty' },
};
const FRANCHISES = {
    marvel:   { short: 'Marvel', full: 'Legendary: A Marvel Deck Building Game', color: '#e62429',
                types: ['Hero', 'Mastermind', 'Scheme', 'Villain'], scenario: 'Scheme', used: 'Heroes & mastermind used',
                scoring: 'detailed', penalties: [
                    { ...P.bystanders, label: 'Bystanders carried away', short: 'Bystanders', per: -4 }, P.twists, P.escaped] },
    alien:    { short: 'Alien', full: 'Legendary Encounters: An Alien Deck Building Game', color: '#45c4c9',
                types: ['Role', 'Character', 'Objective', 'Location'], scenario: 'Objectives', used: 'Roles & characters used',
                scoring: 'simple', scoreLabel: 'Score (1 per surviving player)' },
    bond:     { short: 'James Bond', full: 'Legendary: A James Bond Deck Building Game', color: '#d4d9e0',
                types: ['Hero', 'Mastermind', 'Scheme', 'Villain group', 'Mission group', 'Henchmen'], scenario: 'Scheme',
                used: 'Heroes & mastermind used',
                scoring: 'detailed', penalties: [   // solo scoring from the Bond rulebook
                    { ...P.bystanders, label: 'Gadgets carried away', short: 'Gadgets', per: -4 }, P.twists, P.escaped,
                    { ...P.danger, label: 'Final danger level', short: 'Danger', per: -1 }] },
    predator: { short: 'Predator', full: 'Legendary Encounters: A Predator Deck Building Game', color: '#f2c230',
                types: ['Role', 'Character', 'Objective', 'Location'], scenario: 'Objectives', used: 'Roles & characters used',
                scoring: 'simple', scoreLabel: 'Score (major win: 5 + survivors, minor win: survivors)' },
    matrix:   { short: 'Matrix', full: 'Legendary Encounters: The Matrix', color: '#2fd16b',
                types: ['Avatar', 'Hero group', 'Act'], scenario: 'Acts', used: 'Avatars & hero groups used',
                scoring: 'none' },
    firefly:  { short: 'Firefly', full: 'Legendary Encounters: A Firefly Deck Building Game', color: '#e08a3a',
                types: ['Avatar', 'Supporting character', 'Objective'], scenario: 'Episodes', used: 'Crew used',
                scoring: 'simple', scoreLabel: 'Score (0–6: A = 1, B = 2, win = 3)' },
};
const OUTCOMES = { win: 'Win', loss: 'Loss', draw: 'Draw' };

const MARVEL_EXPANSION_COLORS = {
    "Annihilation": "#8B5CF6", "Ant-Man": "#EF4444", "Black Panther": "#6366F1", "Black Widow": "#EC4899",
    "Captain America": "#3B82F6", "Champions": "#F59E0B", "Civil War": "#6B7280", "Core set": "#10B981",
    "Dark City": "#7C3AED", "Deadpool": "#DC2626", "Dimensions": "#14B8A6", "Doctor Strange": "#8B5CF6",
    "Fantastic Four": "#0EA5E9", "Heroes of Asgard": "#B8860B", "Into the cosmos": "#6366F1", "Midnight Sons": "#4B5563",
    "New Mutants": "#DB2777", "Noir": "#374151", "Paint the town red": "#EF4444", "Realm of Kings": "#A855F7",
    "Revelations": "#16A34A", "S.H.I.E.L.D.S.": "#0284C7", "Secret Wars 2": "#EA580C", "Secret Wars vol1": "#F97316",
    "Secret Wars vol2": "#C2410C", "Venom": "#1F2937", "World war Hulk": "#15803D", "X-Men": "#CA8A04"
};
const PALETTE = ['#8B5CF6', '#EF4444', '#3B82F6', '#F59E0B', '#10B981', '#EC4899', '#0EA5E9', '#7C3AED', '#14B8A6', '#EA580C', '#6366F1', '#DC2626'];

const API_URL = 'api.php';
let cards = [], games = [];
let current = null;              // franchise key or null for overview
let activeTab = 'games';
let sortState = { cards: { col: null, dir: 1 }, games: { col: null, dir: 1 } };
let editingCardId = null, editingGameId = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cfg = () => FRANCHISES[current];

function expansionColor(exp) {
    if (current === 'marvel' && MARVEL_EXPANSION_COLORS[exp]) return MARVEL_EXPANSION_COLORS[exp];
    let h = 0;
    for (const ch of String(exp)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
}
function ratingHtml(n) {
    if (!n) return '<span class="muted">–</span>';
    let pips = '';
    for (let i = 1; i <= 10; i++) pips += `<i class="${i <= n ? 'on' : ''}"></i>`;
    return `<span class="rating"><span class="pips" aria-hidden="true">${pips}</span><b>${n}</b></span>`;
}
function today() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
// Newest first: by play date, then by id (older rows have no date).
function byRecent(a, b) { return (b.playedOn || '').localeCompare(a.playedOn || '') || b.id - a.id; }
function plural(t) { return /(s|men)$/.test(t) ? t : /o$/i.test(t) ? t + 'es' : t + 's'; }
function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function summarize(list) {
    const wins = list.filter(g => g.outcome === 'win').length;
    const losses = list.filter(g => g.outcome === 'loss').length;
    const decided = wins + losses;   // draws don't count towards the win rate
    const scored = list.filter(g => g.sum != null);
    return {
        played: list.length, wins, losses,
        rate: decided ? Math.round(wins / decided * 100) + '%' : '–',
        high: scored.length ? Math.max(...scored.map(g => g.sum)) : '–',
    };
}

/* ---------- Navigation ---------- */
function renderShelf() {
    $('shelf').style.setProperty('--n', Object.keys(FRANCHISES).length);
    $('shelf').innerHTML = Object.entries(FRANCHISES).map(([key, f]) => {
        const n = games.filter(g => g.franchise === key).length;
        return `<button class="spine" style="--c:${f.color}" data-f="${key}" aria-current="${key === current}">
            <span class="name">${esc(f.short)}</span>
            <span class="meta">${n} ${n === 1 ? 'game' : 'games'}</span></button>`;
    }).join('');
}
function go(key) {
    if (key) { location.hash = key; return; }   // hashchange calls route()
    history.pushState(null, '', location.pathname + location.search);
    route();
}
function route() {
    const key = location.hash.slice(1);
    current = FRANCHISES[key] ? key : null;
    document.documentElement.style.setProperty('--accent', current ? cfg().color : '#e62429');
    $('wordmarkSub').textContent = current ? cfg().short : 'Score Board';
    $('tagline').textContent = current ? cfg().full : 'Every game, every expansion, every result.';
    document.title = current ? `${cfg().full} · Score Board` : 'Legendary Score Board';
    renderShelf();
    $('overviewView').hidden = !!current;
    $('franchiseView').hidden = !current;
    if (current) enterFranchise(); else renderOverview();
}

/* ---------- Overview ---------- */
function renderOverview() {
    $('overviewGrid').innerHTML = Object.entries(FRANCHISES).map(([key, f]) => {
        const list = games.filter(g => g.franchise === key);
        const nCards = cards.filter(c => c.franchise === key).length;
        const s = summarize(list);
        const last = [...list].sort(byRecent)[0];
        const body = list.length || nCards
            ? `<div class="ov-nums">
                 <div><b>${s.played}</b><span>played</span></div>
                 <div><b>${s.rate}</b><span>win rate</span></div>
                 <div><b>${s.high}</b><span>high score</span></div>
                 <div><b>${nCards}</b><span>cards rated</span></div>
               </div>
               ${last ? `<div class="ov-recent">Latest: <strong>${esc(last.name)}</strong> (${esc(last.expansion)})${last.playedOn ? ` · ${esc(last.playedOn)}` : ''}</div>` : ''}`
            : `<p class="ov-empty">No games logged yet. Open it to add the first one.</p>`;
        return `<button class="ov-card" style="--c:${f.color}" data-f="${key}">
            <h2>${esc(f.short)}</h2><p class="full">${esc(f.full)}</p>${body}</button>`;
    }).join('');
}

/* ---------- Franchise view ---------- */
function myCards() { return cards.filter(c => c.franchise === current); }
function myGames() { return games.filter(g => g.franchise === current); }

function refreshExpansions() {
    const keep = $('fExpansion').value;
    const exps = [...new Set([...myCards(), ...myGames()].map(x => x.expansion))].sort((a, b) => a.localeCompare(b));
    $('fExpansion').innerHTML = '<option value="">All expansions</option>' + exps.map(e => `<option>${esc(e)}</option>`).join('');
    $('fExpansion').value = exps.includes(keep) ? keep : '';
    $('expansionList').innerHTML = exps.map(e => `<option value="${esc(e)}">`).join('');
}

function enterFranchise() {
    const f = cfg();
    $('fExpansion').value = '';
    refreshExpansions();
    $('fType').innerHTML = '<option value="">All types</option>' + f.types.map(t => `<option value="${esc(t)}">${esc(plural(t))}</option>`).join('');
    $('cType').innerHTML = f.types.map(t => `<option>${esc(t)}</option>`).join('');
    $('gNameLabel').textContent = f.scenario;
    $('gHeroesLabel').textContent = f.used;
    $('detailedScore').hidden = f.scoring !== 'detailed';
    $('simpleScore').hidden = f.scoring !== 'simple';
    $('gScoreLabel').textContent = f.scoreLabel || 'Score';
    // Blank fields mean "score not recorded"; 0 is a real value.
    $('detailedScore').innerHTML = f.scoring !== 'detailed' ? '' :
        `<label>Victory pile<input id="gVictory" type="number" min="0" placeholder="–"></label>` +
        f.penalties.map(p => `<label>${esc(p.label)} (${p.per})<input data-pen="${p.key}" type="number" min="0" placeholder="–"></label>`).join('');
    resetCardForm(); resetGameForm();
    ['fExpansion', 'fType', 'fRating'].forEach(id => $(id).value = '');
    $('fSearch').value = '';
    sortState = { cards: { col: null, dir: 1 }, games: { col: null, dir: 1 } };
    renderAll();
}

function filtered() {
    const exp = $('fExpansion').value, type = $('fType').value;
    const q = $('fSearch').value.trim().toLowerCase();
    const min = parseInt($('fRating').value) || 0;
    const hit = (...fields) => !q || fields.some(v => v && String(v).toLowerCase().includes(q));
    const fc = myCards().filter(c =>
        (!exp || c.expansion === exp) && (!type || c.type === type) &&
        hit(c.name, c.comment, c.expansion) && (!min || (c.ranking || 0) >= min));
    const fg = myGames().filter(g =>
        (!exp || g.expansion === exp) &&
        hit(g.name, g.heroes, g.expansion, g.comment, g.resultNote) && (!min || (g.ranking || 0) >= min));
    return { fc, fg };
}

function sorted(list, which) {
    const { col, dir } = sortState[which];
    if (!col) return list;
    return [...list].sort((a, b) => {
        let x = a[col], y = b[col];
        if (x == null) return 1; if (y == null) return -1;
        if (typeof x === 'string') return x.localeCompare(y) * dir;
        return (x - y) * dir;
    });
}

function renderAll() {
    const { fc, fg } = filtered();
    renderDash();
    renderGames(fg);
    renderCards(fc);
    renderCharts(fc, fg);
    $('dataCount').textContent = `${myCards().length} cards and ${myGames().length} game results in ${cfg().full}.`;
}

function renderDash() {
    const f = cfg(), s = summarize(myGames());
    const c = myCards();
    const typeStats = f.types.slice(0, 2).map(t => `<div class="stat"><span>${esc(plural(t))} rated</span><b>${c.filter(x => x.type === t).length}</b></div>`).join('');
    $('dash').innerHTML = `
        <div class="stat"><span>Games played</span><b>${s.played}</b></div>
        <div class="stat win"><span>Wins</span><b>${s.wins}</b></div>
        <div class="stat loss"><span>Losses</span><b>${s.losses}</b></div>
        <div class="stat"><span>Win rate</span><b>${s.rate}</b></div>
        <div class="stat hi"><span>High score</span><b>${s.high}</b></div>
        <div class="stat"><span>Cards rated</span><b>${c.length}</b></div>
        ${typeStats}`;
}

function sortHead(label, col, which) {
    const s = sortState[which];
    const cls = s.col === col ? `sortable sorted${s.dir < 0 ? ' desc' : ''}` : 'sortable';
    return `<th class="${cls}" data-sort="${col}" data-table="${which}">${esc(label)}</th>`;
}

function renderGames(list) {
    const f = cfg(), detailed = f.scoring === 'detailed', pens = detailed ? f.penalties : [];
    $('gamesHead').innerHTML = `<tr>
        ${sortHead('Expansion', 'expansion', 'games')}
        ${sortHead(f.scenario, 'name', 'games')}
        ${sortHead('Played', 'playedOn', 'games')}
        ${detailed ? sortHead('Victory pile', 'victoryPile', 'games') + pens.map(p => `<th>${esc(p.short)}</th>`).join('') : ''}
        ${f.scoring !== 'none' ? sortHead('Score', 'sum', 'games') : ''}
        <th>${esc(f.used)}</th>
        ${sortHead('Rating', 'ranking', 'games')}
        <th>Result</th><th>Comment</th><th></th></tr>`;
    const cols = 8 + (f.scoring !== 'none') + (detailed ? 1 + pens.length : 0);
    const rows = sortState.games.col ? sorted(list, 'games') : [...list].sort(byRecent);
    if (!rows.length) {
        $('gamesBody').innerHTML = `<tr><td colspan="${cols}" class="empty">${myGames().length ? 'No results match the filters.' : 'No games logged yet. Use “+ Add” to log the first one.'}</td></tr>`;
        return;
    }
    $('gamesBody').innerHTML = rows.map(g => {
        const noScore = g.sum == null;
        const note = g.resultNote ? `<div class="muted">${esc(g.resultNote)}</div>` : '';
        return `<tr>
            <td><span class="tag" style="background:${expansionColor(g.expansion)}">${esc(g.expansion)}</span></td>
            <td><strong>${esc(g.name)}</strong></td>
            <td class="num">${g.playedOn ? esc(g.playedOn) : '<span class="muted">–</span>'}</td>
            ${detailed ? `<td class="num">${noScore ? '<span class="muted">–</span>' : g.victoryPile}</td>` +
                pens.map(p => `<td class="num">${noScore ? '<span class="muted">–</span>' : `${g[p.key]} <span class="pen">(${g[p.pen]})</span>`}</td>`).join('') : ''}
            ${f.scoring !== 'none' ? `<td class="num"><strong>${noScore ? '<span class="muted">–</span>' : g.sum}</strong></td>` : ''}
            <td>${esc(g.heroes) || '<span class="muted">–</span>'}</td>
            <td>${ratingHtml(g.ranking)}</td>
            <td class="res-${g.outcome || 'none'}">${OUTCOMES[g.outcome] || '–'}${note}</td>
            <td>${esc(g.comment) || '<span class="muted">–</span>'}</td>
            <td><div class="row-actions">
                <button class="icon-btn" data-edit-game="${g.id}" title="Edit">✎</button>
                <button class="icon-btn" data-del-game="${g.id}" title="Delete">✕</button></div></td>
        </tr>`;
    }).join('');
}

function renderCards(list) {
    document.querySelectorAll('#panel-cards th.sortable').forEach(th => {
        const s = sortState.cards;
        th.className = s.col === th.dataset.sort ? `sortable sorted${s.dir < 0 ? ' desc' : ''}` : 'sortable';
        th.dataset.table = 'cards';
    });
    const rows = sorted(list, 'cards');
    if (!rows.length) {
        $('cardsBody').innerHTML = `<tr><td colspan="6" class="empty">${myCards().length ? 'No cards match the filters.' : 'No cards rated yet.'}</td></tr>`;
        return;
    }
    $('cardsBody').innerHTML = rows.map(c => `<tr>
        <td><span class="tag" style="background:${expansionColor(c.expansion)}">${esc(c.expansion)}</span></td>
        <td class="type">${esc(c.type)}</td>
        <td><strong>${esc(c.name)}</strong></td>
        <td>${esc(c.comment) || '<span class="muted">–</span>'}</td>
        <td>${ratingHtml(c.ranking)}</td>
        <td><div class="row-actions">
            <button class="icon-btn" data-edit-card="${c.id}" title="Edit">✎</button>
            <button class="icon-btn" data-del-card="${c.id}" title="Delete">✕</button></div></td>
    </tr>`).join('');
}

function barChart(title, items, max) {
    const body = items.length
        ? items.map(i => `<div class="bar"><span class="lbl" title="${esc(i.name)}">${esc(i.name)}</span>
            <div class="track"><div class="fill" style="width:${Math.max(0, i.value) / max * 100}%"></div></div>
            <span class="val">${i.value}</span></div>`).join('')
        : '<p class="muted">Nothing rated yet.</p>';
    return `<div class="chart"><h3>${esc(title)}</h3>${body}</div>`;
}

function renderCharts(fc, fg) {
    const f = cfg();
    const top = t => fc.filter(c => c.type === t && c.ranking).sort((a, b) => b.ranking - a.ranking).slice(0, 8)
        .map(c => ({ name: c.name, value: c.ranking }));
    const byExp = {};
    fc.filter(c => c.ranking).forEach(c => { (byExp[c.expansion] ??= []).push(c.ranking); });
    const expAvg = Object.entries(byExp).map(([name, r]) => ({ name, value: +(r.reduce((a, b) => a + b, 0) / r.length).toFixed(1) }))
        .sort((a, b) => b.value - a.value).slice(0, 8);
    const scored = fg.filter(g => g.sum != null).sort((a, b) => b.sum - a.sum).slice(0, 8).map(g => ({ name: g.name, value: g.sum }));
    const maxScore = Math.max(1, ...scored.map(s => s.value));
    $('charts').innerHTML =
        f.types.slice(0, 3).map(t => barChart(`Top rated ${plural(t).toLowerCase()}`, top(t), 10)).join('') +
        barChart('Expansions by average rating', expAvg, 10) +
        (f.scoring !== 'none' ? barChart('Highest scores', scored, maxScore) : '');
}

/* ---------- API ---------- */
function getPassword() {
    let pw = localStorage.getItem('editPassword');
    if (!pw) {
        pw = prompt('Edit password:');
        if (pw) localStorage.setItem('editPassword', pw);
    }
    return pw;
}
async function api(action, payload) {
    const password = getPassword();
    if (!password) return null;
    try {
        const res = await fetch(`${API_URL}?action=${action}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, password }),
        });
        const data = await res.json();
        if (data.error === 'Invalid password') { localStorage.removeItem('editPassword'); toast('Wrong password. Try again.'); return null; }
        if (data.error) { toast(data.error); return null; }
        return data;
    } catch (e) {
        toast('Could not reach the server. Nothing was saved.');
        return null;
    }
}
async function load() {
    try {
        const res = await fetch(`${API_URL}?action=load`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        cards = data.cards || []; games = data.games || [];
    } catch (e) {
        toast('Could not load data: ' + e.message);
    }
}

/* ---------- Forms ---------- */
// sum is null when no score was recorded, so a real 0 stays distinguishable.
function computeScore() {
    const f = cfg();
    const out = { victoryPile: 0, sum: null };
    Object.values(P).forEach(p => { out[p.key] = 0; out[p.pen] = 0; });
    if (f.scoring === 'simple') {
        const s = parseInt($('gScore').value);
        out.sum = isNaN(s) ? null : s;
    } else if (f.scoring === 'detailed') {
        const inputs = [$('gVictory'), ...$('detailedScore').querySelectorAll('[data-pen]')];
        if (inputs.every(i => i.value === '')) return out;
        out.victoryPile = parseInt($('gVictory').value) || 0;
        out.sum = out.victoryPile;
        f.penalties.forEach(p => {
            out[p.key] = parseInt($('detailedScore').querySelector(`[data-pen="${p.key}"]`).value) || 0;
            out[p.pen] = out[p.key] * p.per;
            out.sum += out[p.pen];
        });
    }
    return out;
}
function updatePreview() {
    const sum = computeScore().sum;
    $('scorePreview').innerHTML = cfg().scoring === 'detailed' ? `Total score: <b>${sum ?? '–'}</b>` : '';
}

function resetGameForm() {
    editingGameId = null;
    $('gameForm').reset();
    $('gameForm').classList.remove('editing');
    $('gameFormTitle').textContent = 'Add game result';
    $('gameSubmit').textContent = 'Add result';
    $('gameCancel').hidden = true;
    $('gPlayed').value = today();
    updatePreview();
}
function resetCardForm() {
    editingCardId = null;
    $('cardForm').reset();
    $('cardForm').classList.remove('editing');
    $('cardFormTitle').textContent = 'Add card';
    $('cardSubmit').textContent = 'Add card';
    $('cardCancel').hidden = true;
}
function showTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'panel-' + tab);
}

function editGame(id) {
    const g = games.find(x => x.id == id); if (!g) return;
    resetGameForm();
    editingGameId = g.id;
    $('gExpansion').value = g.expansion; $('gName').value = g.name; $('gPlayed').value = g.playedOn || '';
    $('gRating').value = g.ranking ?? ''; $('gHeroes').value = g.heroes || ''; $('gComment').value = g.comment || '';
    $('gScore').value = g.sum ?? '';
    if (cfg().scoring === 'detailed' && g.sum != null) {
        $('gVictory').value = g.victoryPile;
        $('detailedScore').querySelectorAll('[data-pen]').forEach(i => i.value = g[i.dataset.pen]);
    }
    $('gOutcome').value = g.outcome || '';
    $('gResultNote').value = g.resultNote || '';
    $('gameForm').classList.add('editing');
    $('gameFormTitle').textContent = `Edit game result: ${g.name}`;
    $('gameSubmit').textContent = 'Save changes';
    $('gameCancel').hidden = false;
    updatePreview();
    showTab('add');
    $('gameForm').scrollIntoView({ behavior: 'smooth' });
}
function editCard(id) {
    const c = cards.find(x => x.id == id); if (!c) return;
    resetCardForm();
    editingCardId = c.id;
    if (![...$('cType').options].some(o => o.value === c.type)) $('cType').add(new Option(c.type));
    $('cExpansion').value = c.expansion; $('cType').value = c.type; $('cName').value = c.name;
    $('cRating').value = c.ranking ?? ''; $('cComment').value = c.comment || '';
    $('cardForm').classList.add('editing');
    $('cardFormTitle').textContent = `Edit card: ${c.name}`;
    $('cardSubmit').textContent = 'Save changes';
    $('cardCancel').hidden = false;
    showTab('add');
    $('cardForm').scrollIntoView({ behavior: 'smooth' });
}

$('gameForm').addEventListener('submit', async e => {
    e.preventDefault();
    const game = {
        franchise: current,
        expansion: $('gExpansion').value.trim(), name: $('gName').value.trim(),
        playedOn: $('gPlayed').value || null,
        comment: $('gComment').value.trim(), ranking: parseInt($('gRating').value) || null,
        heroes: $('gHeroes').value.trim(),
        outcome: $('gOutcome').value || null, resultNote: $('gResultNote').value.trim(),
        ...computeScore(),
    };
    if (editingGameId) game.id = editingGameId;
    const res = await api('saveGame', game);
    if (!res) return;
    game.id = res.id;
    const i = games.findIndex(g => g.id === game.id);
    if (i >= 0) games[i] = game; else games.push(game);
    toast(editingGameId ? 'Game result saved' : 'Game result added');
    resetGameForm(); refreshExpansions(); renderShelf(); renderAll(); showTab('games');
});
$('cardForm').addEventListener('submit', async e => {
    e.preventDefault();
    const card = {
        franchise: current,
        expansion: $('cExpansion').value.trim(), type: $('cType').value, name: $('cName').value.trim(),
        comment: $('cComment').value.trim(), ranking: parseInt($('cRating').value) || null,
    };
    if (editingCardId) card.id = editingCardId;
    const res = await api('saveCard', card);
    if (!res) return;
    card.id = res.id;
    const i = cards.findIndex(c => c.id === card.id);
    if (i >= 0) cards[i] = card; else cards.push(card);
    toast(editingCardId ? 'Card saved' : 'Card added');
    const wasEditing = !!editingCardId;
    resetCardForm(); refreshExpansions(); renderAll();
    showTab(wasEditing ? 'cards' : 'add');
});

async function remove(kind, id) {
    const list = kind === 'card' ? cards : games;
    const item = list.find(x => x.id == id); if (!item) return;
    if (!confirm(`Delete “${item.name}”? This can’t be undone.`)) return;
    const res = await api(kind === 'card' ? 'deleteCard' : 'deleteGame', { id: item.id });
    if (!res) return;
    if (kind === 'card') cards = cards.filter(c => c.id !== item.id); else games = games.filter(g => g.id !== item.id);
    toast(`Deleted ${item.name}`);
    renderShelf(); renderAll();
}

function download(name, data) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
    const t = e.target.closest('button, th'); if (!t) return;
    if (t.dataset.f) return go(t.dataset.f);
    if (t.dataset.tab) return showTab(t.dataset.tab);
    if (t.dataset.editGame) return editGame(t.dataset.editGame);
    if (t.dataset.editCard) return editCard(t.dataset.editCard);
    if (t.dataset.delGame) return remove('game', t.dataset.delGame);
    if (t.dataset.delCard) return remove('card', t.dataset.delCard);
    if (t.matches('th.sortable')) {
        const which = t.dataset.table, s = sortState[which];
        s.dir = s.col === t.dataset.sort ? -s.dir : (['ranking', 'sum', 'victoryPile', 'playedOn'].includes(t.dataset.sort) ? -1 : 1);
        s.col = t.dataset.sort;
        renderAll();
    }
});
$('homeBtn').addEventListener('click', () => go(null));
['fExpansion', 'fType', 'fRating'].forEach(id => $(id).addEventListener('change', renderAll));
$('fSearch').addEventListener('input', renderAll);
$('detailedScore').addEventListener('input', updatePreview);
$('gameCancel').addEventListener('click', resetGameForm);
$('cardCancel').addEventListener('click', resetCardForm);
$('exportBtn').addEventListener('click', () => download(`legendary-${current}.json`, { cards: myCards(), games: myGames() }));
$('exportAllBtn').addEventListener('click', () => download('legendary-all.json', { cards, games }));
$('logoutBtn').addEventListener('click', () => { localStorage.removeItem('editPassword'); toast('Edit password forgotten on this device'); });
window.addEventListener('hashchange', route);

(async () => { await load(); route(); })();
</script>
</body>
</html>
